<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forward Sourcing Quest · Modo Equipo · Compras SEAT/CUPRA</title>
<style>
:root{--acc:#52D273;--txt:#F7FAFC;--sub:#BCD0DE;--panel:rgba(9,18,34,.88)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#060d1a;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
#scene{position:absolute;inset:0;transition:background 1s;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dec{position:absolute;opacity:.2;animation:drift linear infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(8deg)}}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

#hud{position:absolute;top:12px;left:12px;right:12px;height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border:3px solid var(--acc);border-radius:18px;z-index:20;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#hud .lvl{font-size:12px;font-weight:900;letter-spacing:2px;color:#07111E;background:var(--acc);padding:5px 10px;border-radius:10px;white-space:nowrap}
#hud .name{font-size:20px;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-weight:900;font-size:15px;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.08);white-space:nowrap}
#hudTeam{color:#9fe3ff}#hudScore{color:#FFD25A}#hudMyths{color:#FF9EC0}#hudPart{color:#ffd0b8}
#combo{color:#FF9A3D;display:none}
.iconbtn{background:rgba(255,255,255,.08);color:var(--txt);border-radius:10px;padding:7px 10px;font-size:15px}
.iconbtn:hover{background:rgba(255,255,255,.18)}
#stage{position:absolute;top:86px;bottom:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:center;z-index:5}

.panel{background:var(--panel);border:3px solid rgba(255,255,255,.12);border-radius:22px;padding:22px 28px;box-shadow:0 8px 0 rgba(0,0,0,.35),0 20px 50px rgba(0,0,0,.5)}
.accent{border-color:var(--acc)}
h1{font-weight:900}h2{font-size:30px;font-weight:900;margin-bottom:8px}h3{font-size:21px;font-weight:900;margin-bottom:6px}
.sub{color:var(--sub);font-size:18px;line-height:1.5}
.small{font-size:14px;color:var(--sub)}
.btn{background:var(--acc);color:#07111E;border-radius:16px;padding:15px 32px;font-weight:900;font-size:19px;letter-spacing:1px;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 9px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--txt)}
.btn.gold{background:#FFD25A}
.btn.red{background:#FF496A;color:#fff}
.btn.wiggle{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-4deg) scale(1.05)}88%{transform:rotate(4deg) scale(1.05)}92%{transform:rotate(-2deg)}}
.zoomin{animation:zoomin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slideup{animation:slideup .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slideup{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.2)}}
.bounce{animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.feedback{min-height:54px;padding:13px 18px;border-radius:16px;font-size:18px;font-weight:700;background:var(--panel);border:3px solid rgba(255,255,255,.12);transition:all .3s;line-height:1.35}
.feedback.ok{border-color:#52D273;color:#c9f8d7}.feedback.ko{border-color:#FF496A;color:#ffc9d3}
.floater{position:fixed;z-index:80;font-weight:900;font-size:30px;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.5)}
@keyframes floatup{to{transform:translateY(-80px) scale(1.3);opacity:0}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;animation:flash .45s forwards}
@keyframes flash{from{opacity:.45}to{opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}

/* ---------- CHULETA (dentro de cada pregunta) ---------- */
.cheat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#FFD25A;color:#07111E;border-radius:14px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.3);font-size:15px;font-weight:700;line-height:1.3;max-width:100%}
.cheat .ct{font-weight:900;letter-spacing:2px;font-size:12px;background:#07111E;color:#FFD25A;padding:4px 8px;border-radius:8px}
.cheat .cd b{font-weight:900}
.cheat .cd+.cd::before{content:"·";margin-right:8px;opacity:.5}
.term{border-bottom:3px dotted #FFD25A;cursor:help;white-space:nowrap}

/* ---------- TURNO / DEBATE ---------- */
.turnbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.captain{display:inline-flex;align-items:center;gap:10px;background:#45C9FF;color:#07111E;font-weight:900;font-size:18px;padding:8px 16px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.captain .mic{font-size:22px;animation:bounce 1.2s ease-in-out infinite}
.debate{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;color:#c9e6ff;background:rgba(255,255,255,.07);padding:8px 14px;border-radius:999px}
.debate .bar{width:140px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.debate .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#45C9FF,#52D273);transition:width .25s linear}
.debate.done{color:#FFD25A;animation:pop .5s}
.debate.done .bar i{background:#FFD25A}
.confirmrow{display:flex;justify-content:center;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.confirmrow .hint{font-weight:800;color:var(--sub);font-size:16px}

/* ---------- MASCOTA ---------- */
.mascot{position:relative;width:86px;height:86px;flex:none}
.mascot .body{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#ffd9b0,#E8A06A 45%,#B5652F);box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.3);animation:squish 1.6s ease-in-out infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95) translateY(3px)}}
.mascot .eye{position:absolute;top:30px;width:14px;height:18px;background:#fff;border-radius:50%;animation:blink 4s infinite}
.mascot .eye::after{content:"";position:absolute;left:4px;top:5px;width:7px;height:9px;background:#07111E;border-radius:50%}
.mascot .eye.l{left:24px}.mascot .eye.r{right:24px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot .mouth{position:absolute;left:32px;top:54px;width:22px;height:11px;border-radius:0 0 12px 12px;background:#5a1d0e}
.mascot .hat{position:absolute;left:18px;top:-14px;font-size:34px;transform:rotate(-10deg)}
.mascot.sad .mouth{border-radius:12px 12px 0 0;top:58px}
.mascot.happy .body{animation:jump .5s ease 2}
@keyframes jump{50%{transform:translateY(-22px) scale(1.05)}}
.bubble{position:relative;background:#fff;color:#07111E;font-weight:800;font-size:17px;padding:12px 16px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.3);max-width:480px;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
.talk{display:flex;align-items:flex-start;gap:16px}

/* ---------- PORTADA ---------- */
.title{text-align:center;max-width:900px}
.title .logo{font-size:clamp(40px,7vw,84px);font-weight:900;line-height:.95;letter-spacing:1px}
.title .logo span{display:inline-block;animation:letter 2.4s ease-in-out infinite}
@keyframes letter{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title .kicker{letter-spacing:6px;color:var(--sub);font-weight:800;font-size:14px;margin-bottom:12px}
.teambadge{display:inline-block;background:#45C9FF;color:#07111E;font-weight:900;padding:6px 14px;border-radius:999px;letter-spacing:2px;font-size:14px;margin-top:10px}
.missioncard{display:inline-flex;align-items:center;gap:14px;background:#fff;color:#07111E;border-radius:18px;padding:12px 20px;margin-top:16px;box-shadow:0 6px 0 rgba(0,0,0,.35);font-weight:800;font-size:18px;text-align:left}
.missioncard .big{font-size:44px}
.missioncard b{display:block;font-size:12px;letter-spacing:3px;color:#FF496A}

/* ---------- SETUP ---------- */
.setup{width:min(1000px,96vw);display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field label{font-weight:900;font-size:15px;letter-spacing:1px;color:var(--sub)}
.field input{background:#fff;color:#07111E;border:none;border-radius:14px;padding:13px 16px;font-size:19px;font-weight:800;outline:none;user-select:text}
.playerchips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.pchip{background:#45C9FF;color:#07111E;font-weight:900;padding:7px 12px;border-radius:999px;font-size:16px;display:flex;gap:8px;align-items:center}
.pchip button{background:rgba(0,0,0,.2);color:#07111E;border-radius:50%;width:22px;height:22px;font-weight:900;font-size:13px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--txt);font-weight:900;font-size:16px}
.seg button.on{background:var(--acc);color:#07111E}
.rules li{margin:9px 0 9px 24px;font-size:17px;color:#dce8f5;line-height:1.4}

/* ---------- ¿QUÉ ES? ---------- */
.whatis{width:min(1050px,96vw);display:flex;flex-direction:column;align-items:center;gap:16px}
.whatis .q{font-size:clamp(28px,4vw,44px);font-weight:900;text-align:center}
.def{font-size:clamp(20px,2.6vw,30px);font-weight:900;text-align:center;background:#fff;color:#07111E;padding:16px 26px;border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);max-width:900px;line-height:1.25}
.def mark{background:#FFD25A;padding:0 6px;border-radius:6px}
.contest{position:relative;width:min(900px,94vw);height:170px}
.contest .fac{position:absolute;bottom:20px;font-size:54px;text-align:center;transition:all .8s cubic-bezier(.2,1.4,.4,1)}
.contest .fac small{display:block;font-size:12px;font-weight:900;color:var(--sub)}
.contest .podium{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:130px;height:46px;background:#FFD25A;border-radius:10px 10px 0 0;color:#07111E;font-weight:900;display:grid;place-items:center;font-size:22px}
.contest .trophy{position:absolute;left:50%;top:0;transform:translateX(-50%) scale(0);font-size:50px;transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
.how3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(900px,94vw)}
.how3 div{background:var(--panel);border-radius:18px;padding:14px;text-align:center;border:3px solid rgba(255,255,255,.12);font-weight:800;font-size:17px}
.how3 .e{font-size:38px;display:block}
.how3 small{display:block;color:var(--sub);font-weight:600;margin-top:4px;font-size:14px}

/* ---------- MAPA ---------- */
.mapcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;height:100%}
.mapwrap{position:relative;width:min(1150px,98vw);flex:1;min-height:360px;max-height:560px}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.island{position:absolute;transform:translate(-50%,-50%);width:160px;text-align:center;cursor:pointer;transition:transform .2s}
.island:hover:not(.locked){transform:translate(-50%,-55%) scale(1.06)}
.island .disc{position:relative;width:110px;height:110px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:52px;border:5px solid var(--c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 30px color-mix(in srgb,var(--c) 50%,transparent)}
.island .lbl{margin-top:8px;font-weight:900;font-size:15px;background:var(--panel);border-radius:10px;padding:5px 8px;border:2px solid var(--c)}
.island .lbl small{display:block;color:var(--sub);font-size:11px;letter-spacing:1px}
.island.locked{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.island.locked .disc::after{content:"🔒";position:absolute;font-size:30px}
.island.cur .disc{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 60px var(--c)}}
.island .done{position:absolute;top:-4px;right:22px;width:36px;height:36px;border-radius:50%;background:#52D273;color:#07111E;font-weight:900;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.4);z-index:2}
.island .done.new{animation:zoomin .6s .9s cubic-bezier(.2,1.8,.4,1) both}
.island .mythflag{position:absolute;top:-8px;left:12px;background:#7B2CFF;color:#fff;font-size:11px;font-weight:900;padding:4px 7px;border-radius:8px;transform:rotate(-8deg);box-shadow:0 3px 0 rgba(0,0,0,.4);z-index:2}
.island .mythflag.bust{background:#2a3444;text-decoration:line-through;color:#aaa}
.here{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none;transition:left 1.2s cubic-bezier(.5,-0.2,.5,1.2),top 1.2s cubic-bezier(.5,-0.2,.5,1.2)}
.here .m{transform:translate(-105px,-75px) scale(.7);animation:hop .45s ease-in-out infinite alternate}
@keyframes hop{to{transform:translate(-105px,-89px) scale(.7)}}
.here .pin{position:absolute;left:-62px;top:-118px;transform:translateX(-50%);background:#FFD25A;color:#07111E;font-weight:900;font-size:12px;padding:4px 9px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.mapbar{display:flex;align-items:center;gap:18px;padding:12px 18px;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:#2a3444;border:2px solid rgba(255,255,255,.3)}
.dots i.on{background:#52D273;border-color:#52D273}
.dots i.next{background:#FFD25A;border-color:#FFD25A;animation:pop 1s infinite}

/* ---------- INTRO MUNDO ---------- */
.intro{width:min(1060px,96vw);display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.bigicon{font-size:76px;line-height:1}
.plain{margin-top:14px;background:#fff;color:#07111E;border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700;line-height:1.4;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.plain b{display:block;font-size:13px;letter-spacing:2px;color:#7B2CFF;margin-bottom:4px}
.howto li{margin:9px 0 9px 22px;color:#dce8f5;font-size:17px;line-height:1.4}
.reward{background:var(--acc);color:#07111E;font-weight:900;border-radius:14px;padding:12px;text-align:center;margin-top:12px}

/* ---------- OPCIONES ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;background:#fff;color:#07111E;border-radius:16px;padding:14px 16px;text-align:left;font-size:18px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .12s,background .2s;outline:4px solid transparent}
.opt:hover{transform:translateX(6px)}
.opt b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#07111E;color:#fff;font-size:16px}
.opt.sel{background:#FFE7A0;outline-color:#FF9A3D;transform:translateX(10px)}
.opt.right{background:#52D273;outline-color:#fff}
.opt.wrong{background:#FF496A;color:#fff;opacity:.65}

/* ---------- SALA CSC ---------- */
.room{width:min(1120px,97vw);display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:stretch}
.photo{position:relative;border-radius:22px;overflow:hidden;border:4px solid #FF496A;box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 40px rgba(255,73,106,.35);min-height:400px;background-size:cover;background-position:center;background-repeat:no-repeat}
.photo .tag{position:absolute;left:14px;top:14px;background:#FF496A;color:#fff;font-weight:900;letter-spacing:2px;font-size:12px;padding:6px 12px;border-radius:10px}
.photo .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-weight:900;font-size:20px}
.photo .cap small{display:block;font-size:14px;color:var(--sub);font-weight:700}
.influence{display:flex;flex-direction:column;gap:8px}
.inf{display:flex;gap:14px;align-items:center;background:#fff;color:#07111E;border-radius:16px;padding:11px 16px;box-shadow:0 5px 0 rgba(0,0,0,.35);font-weight:700;font-size:15.5px;line-height:1.35}
.inf .e{font-size:30px;flex:none}
.inf b{display:block;font-size:17px}
.twocom{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.twocom .inf{flex-direction:column;align-items:flex-start;gap:4px}

/* ---------- MILLONARIO ---------- */
.mill{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3b1a8c 0%,#120a3a 45%,#03030f 80%)}
.beam{position:absolute;bottom:-10%;left:50%;width:180px;height:140%;transform-origin:50% 100%;background:linear-gradient(to top,rgba(140,110,255,.35),transparent 80%);filter:blur(6px);animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-50%) rotate(-28deg)}50%{transform:translateX(-50%) rotate(28deg)}}
.beam.b2{animation-delay:-3s;background:linear-gradient(to top,rgba(70,200,255,.3),transparent 80%)}
.millin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:16px}
.millhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.millhead .tag{font-weight:900;letter-spacing:4px;color:#FFD25A;font-size:14px}
.lifelines{display:flex;gap:10px}
.ll{width:62px;height:42px;border-radius:50%;border:3px solid #8fb2ff;background:radial-gradient(#26307a,#0c1240);color:#fff;font-weight:900;font-size:15px;box-shadow:0 0 14px rgba(120,150,255,.5)}
.ll:disabled{opacity:.3;cursor:not-allowed;background:#222;text-decoration:line-through}
.hex{position:relative;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:linear-gradient(#5a6fe0,#2a3aa8);padding:3px}
.hex>div{clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:radial-gradient(ellipse at 50% 0,#1f2a78,#070b30);padding:18px 46px;text-align:center}
.millq{width:min(960px,94vw)}
.millq>div{font-size:clamp(21px,2.7vw,30px);font-weight:800;padding:20px 60px}
.millopts{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;width:min(980px,94vw)}
.mo{cursor:pointer;transition:transform .15s}
.mo:hover{transform:scale(1.02)}
.mo>div{text-align:left;font-size:18px;font-weight:700;padding:15px 40px;color:#fff}
.mo b{color:#FFD25A;margin-right:10px}
.mo.sel{background:linear-gradient(#ffb347,#c46a00)}.mo.sel>div{background:linear-gradient(#ff9d2e,#b85b00)}.mo.sel b{color:#07111E}
.mo.right{background:linear-gradient(#7dff9e,#1e9a44);animation:blinkg .25s 6 alternate}.mo.right>div{background:linear-gradient(#3ccf69,#13792f)}
@keyframes blinkg{to{filter:brightness(1.5)}}
.mo.wrong{background:#a01530}.mo.wrong>div{background:#5c0c1d}
.mo.gone{visibility:hidden}
.mo.locked{pointer-events:none}
.ladder{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:6px;width:180px}
.ladder div{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:900;color:#8fb2ff;background:rgba(10,15,60,.7);border:2px solid #26307a}
.ladder div.cur{background:#ff9d2e;color:#07111E;border-color:#ffd25a}
.ladder div.ok{color:#52D273;border-color:#1e9a44}
.audience{display:flex;gap:16px;align-items:flex-end;height:130px;padding:10px 16px;background:rgba(10,15,60,.85);border:2px solid #5a6fe0;border-radius:14px}
.audience .bar{width:44px;text-align:center;font-weight:900;font-size:13px}
.audience .bar i{display:block;background:linear-gradient(#ffd25a,#ff9d2e);border-radius:6px 6px 0 0;transition:height 1.2s cubic-bezier(.2,1.2,.4,1);height:0}
.remark{width:min(980px,94vw);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:#fff;color:#07111E;border-radius:24px;padding:20px 26px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.remark .stamp{font-size:15px;font-weight:900;letter-spacing:2px;color:#fff;background:#FF3B5C;padding:6px 12px;border-radius:10px;display:inline-block;transform:rotate(-3deg);margin-bottom:8px}
.remark .myth{font-size:16px;font-weight:700;color:#8a8a8a;text-decoration:line-through;text-decoration-color:#FF3B5C;text-decoration-thickness:3px}
.remark h3{font-size:25px;margin:6px 0}
.remark p{font-size:18px;line-height:1.45}
.remark .fun{margin-top:10px;background:#FFD25A;border-radius:12px;padding:10px 14px;font-weight:900;font-size:17px}
.remark .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.remark .chips span{background:#07111E;color:#fff;font-weight:800;font-size:14px;padding:5px 10px;border-radius:10px}

/* ---------- MUNDO 1 ---------- */
.table1{width:min(1120px,97vw);display:flex;flex-direction:column;gap:10px;align-items:center}
.cardgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;perspective:1000px}
.pcard{position:relative;height:150px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s}
.pcard .face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.pcard .front{background:#fff;color:#07111E;font-weight:800;font-size:15px;line-height:1.2;border:4px solid transparent;transition:border .2s,transform .2s}
.pcard .front .e{font-size:36px}
.pcard .front .num{position:absolute;top:8px;left:10px;font-size:13px;font-weight:900;color:#8a8a8a}
.pcard:hover .front{transform:translateY(-4px)}
.pcard.sel .front{border-color:#FF9A3D;background:#FFE7A0;transform:translateY(-8px) rotate(-1deg)}
.pcard.sel .front::after{content:"🧺";position:absolute;top:6px;right:8px;font-size:22px}
.pcard .back{transform:rotateY(180deg);font-size:14px;font-weight:700;line-height:1.3}
.pcard .back .e{font-size:26px}
.pcard .back b{font-size:15px}
.pcard.flip{transform:rotateY(180deg);cursor:default}
.pcard.r-ok .back{background:#52D273;color:#07111E}
.pcard.r-trap .back{background:#FF496A;color:#fff}
.pcard.r-miss .back{background:#FFD25A;color:#07111E}
.pcard.r-fine .back{background:#2a3444;color:#c9d6e6}
.basketbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.slot{width:58px;height:58px;border-radius:16px;border:3px dashed #52D273;display:grid;place-items:center;font-size:28px;background:rgba(82,210,115,.08);transition:all .3s}
.slot.full{border-style:solid;background:rgba(82,210,115,.35);transform:scale(1.06)}

/* ---------- MUNDO 2 ---------- */
.rfq{width:min(1080px,96vw);display:flex;flex-direction:column;gap:11px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tslot{height:116px;border-radius:18px;border:3px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px;font-weight:800;color:var(--sub);position:relative;font-size:16px;cursor:pointer;transition:all .25s}
.tslot .n{position:absolute;top:-14px;left:-10px;width:36px;height:36px;border-radius:50%;background:#1b2636;border:3px solid rgba(255,255,255,.3);display:grid;place-items:center;font-weight:900;color:#fff}
.tslot.filled{border:3px solid #FF9A3D;background:rgba(255,154,61,.18);color:#fff}
.tslot.ok{border:3px solid #52D273;background:rgba(82,210,115,.25);cursor:default}
.tslot.ok .n{background:#52D273;color:#07111E}
.tslot .e{font-size:32px}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-height:116px}
.tcard{background:#fff;color:#07111E;border-radius:18px;padding:14px 10px;font-weight:800;font-size:16px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .15s;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tcard:nth-child(odd){transform:rotate(-2deg)}.tcard:nth-child(even){transform:rotate(2deg)}
.tcard:hover{transform:translateY(-8px) rotate(0) scale(1.04)}
.tcard .e{font-size:32px}
.market{display:flex;justify-content:space-around;align-items:flex-end;height:80px;position:relative}
.market .f{font-size:46px;text-align:center}
.market .f small{display:block;font-size:12px;font-weight:900;color:var(--sub)}
.env{position:fixed;font-size:36px;z-index:50;pointer-events:none;transition:all 1s cubic-bezier(.4,-0.3,.6,1.3)}

/* ---------- MUNDO 3 · EXPEDIENTES ---------- */
.w3{width:min(1120px,97vw);display:flex;flex-direction:column;gap:10px;align-items:center}
.lineup{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lu{padding:7px 14px;border-radius:12px;background:var(--panel);border:2px solid rgba(255,255,255,.15);font-weight:900;font-size:15px}
.lu.cur{border-color:#B777FF;box-shadow:0 0 16px #B777FF}.lu.in{background:#52D273;color:#07111E}.lu.out{opacity:.4;text-decoration:line-through}
.dossier{width:min(940px,96vw);background:#fff;color:#07111E;border-radius:24px;padding:16px 22px;box-shadow:0 10px 0 rgba(0,0,0,.4);transition:transform .5s cubic-bezier(.5,-0.4,.6,1),opacity .5s}
.dossier.in{animation:zoomin .45s cubic-bezier(.2,1.5,.4,1)}
.dossier.outL{transform:translateX(-140%) rotate(-18deg);opacity:0}
.dossier.outR{transform:translateX(140%) rotate(18deg);opacity:0}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.dhead .logo{font-size:50px}
.dhead .nm{font-size:24px;font-weight:900}
.dhead .nm small{display:block;font-size:13px;color:#7B2CFF;letter-spacing:2px}
.dhead .stampx{margin-left:auto;font-weight:900;font-size:13px;letter-spacing:2px;color:#7B2CFF;border:3px solid #7B2CFF;border-radius:10px;padding:4px 10px;transform:rotate(4deg)}
.drow{display:grid;grid-template-columns:200px 1fr 40px;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;font-size:17px;line-height:1.3;transition:background .3s}
.drow:nth-child(odd){background:#f3f1fa}
.drow .g{font-weight:900;font-size:14px;letter-spacing:.5px}
.drow .g.x{color:#c4501a}
.drow .ev{font-weight:600}
.drow .r{font-size:22px;text-align:center;opacity:0;transform:scale(.3);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.drow.ok .r,.drow.ko .r{opacity:1;transform:none}
.drow.ko{background:#ffd6dd!important}
.drow.ok{background:#dff7e6!important}
.dsep{font-size:11px;font-weight:900;letter-spacing:2px;color:#c4501a;padding:6px 10px 2px}

/* ---------- MUNDO 4 ---------- */
.tug{width:min(1100px,96vw);display:flex;flex-direction:column;gap:11px}
.ropearea{position:relative;height:130px;background:var(--panel);border-radius:22px;border:3px solid #FF9A3D;overflow:hidden}
.ropearea .rope{position:absolute;left:110px;right:110px;top:70px;height:10px;background:repeating-linear-gradient(45deg,#c58b4a 0 8px,#8a5a2b 8px 16px);border-radius:6px}
.ropearea .side{position:absolute;top:16px;font-size:56px;text-align:center;width:110px;transition:transform .3s}
.ropearea .side small{display:block;font-size:12px;font-weight:900;color:var(--sub)}
.ropearea .l{left:0}.ropearea .r{right:0}
.ropearea .knot{position:absolute;top:47px;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:#FF9A3D;border:4px solid #fff;display:grid;place-items:center;font-weight:900;font-size:12px;color:#07111E;transition:left .8s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 20px #FF9A3D}
.ropearea .goal{position:absolute;top:22px;bottom:22px;width:4px;background:repeating-linear-gradient(#52D273 0 8px,transparent 8px 14px)}
.ropearea .goal span{position:absolute;top:-4px;left:8px;font-size:12px;font-weight:900;color:#52D273;white-space:nowrap}
.ropearea .start span{color:#FF496A}
.pricebig{font-size:42px;font-weight:900;text-align:center}
.tuggrid{display:grid;grid-template-columns:1fr 1.8fr;gap:14px}
.levers{display:flex;gap:6px;flex-wrap:wrap}
.lever{font-size:12px;font-weight:900;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--sub)}
.lever.on{background:#FF9A3D;color:#07111E}

/* ---------- MUNDO 5 · COMITÉ ---------- */
.bossarena{width:min(1120px,97vw);display:flex;flex-direction:column;gap:9px;align-items:center}
.hpwrap{width:min(700px,90vw)}
.hp{height:26px;border-radius:14px;background:#2a0a14;border:3px solid #FF496A;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#FF496A,#FF9A3D);transition:width .8s cubic-bezier(.3,1.5,.5,1)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:2px}
.bosses{display:flex;gap:40px;justify-content:center;align-items:flex-end}
.boss{display:flex;flex-direction:column;align-items:center;transition:all .4s;opacity:.45;filter:grayscale(.5)}
.boss .face{font-size:62px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4));transition:transform .3s}
.boss .tag{font-size:13px;font-weight:900;background:#3a0d1a;border:2px solid #FF496A;border-radius:10px;padding:5px 10px;margin-top:6px;text-align:center;line-height:1.2}
.boss .tag small{display:block;font-size:11px;color:#ffc9d3;font-weight:700}
.boss.wob .tag{background:#0b2a5a;border-color:#45C9FF}.boss.wob .tag small{color:#bfe8ff}
.boss.active{opacity:1;filter:none}
.boss.active .face{transform:translateY(-10px) scale(1.25);animation:angry .7s ease-in-out infinite}
@keyframes angry{50%{transform:translateY(-14px) scale(1.28) rotate(-5deg)}}
.boss.happy{opacity:1;filter:none}
.table{width:min(700px,92vw);height:24px;border-radius:50% 50% 10px 10px/30px 30px 10px 10px;background:linear-gradient(#c79a5a,#8a5f2b);margin-top:-10px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.bossq{background:#fff;color:#07111E;font-size:22px;font-weight:900;padding:13px 22px;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center;max-width:880px}
.anscards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(1060px,96vw)}
.ans{background:linear-gradient(#26305a,#141a38);border:3px solid #5a6fe0;border-radius:18px;padding:14px;color:#fff;font-weight:800;font-size:17px;min-height:88px;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .15s;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px}
.ans b{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#07111E;font-size:14px}
.ans:hover{transform:translateY(-6px) rotate(-1deg)}
.ans.sel{border-color:#FFD25A;background:linear-gradient(#5a4a10,#2e2508);transform:translateY(-6px)}
.ans.right{background:#52D273;border-color:#fff;color:#07111E}
.ans.wrong{background:#5c0c1d;border-color:#FF496A;opacity:.6}
.proj{position:fixed;z-index:60;font-size:44px;pointer-events:none;transition:all .45s cubic-bezier(.5,0,.8,.4)}
.boom{position:fixed;z-index:61;font-size:80px;pointer-events:none;animation:boom .6s forwards;transform:translate(-50%,-50%)}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2)}50%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}

/* ---------- FIN ---------- */
.complete{text-align:center;max-width:820px}
.stars{font-size:46px;letter-spacing:8px}
.stars span{display:inline-block;animation:zoomin .5s cubic-bezier(.2,1.6,.4,1) both}
.badge{display:inline-block;margin:12px 0;padding:12px 22px;border-radius:14px;background:var(--acc);color:#07111E;font-weight:900;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.learn{text-align:left;margin:12px 0 18px;background:rgba(255,255,255,.05);border-radius:14px;padding:14px 18px;border-left:5px solid var(--acc)}
.learn li{margin:7px 0 7px 18px;color:#dce8f5;font-size:17px}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.sumc{border-radius:14px;padding:10px;background:rgba(15,28,46,.9);border-top:5px solid var(--c);font-size:12px;text-align:left}
.sumc .e{font-size:26px}.sumc .n{font-weight:900;font-size:13px;margin:3px 0}.sumc .d{color:var(--sub);line-height:1.35}
.glossary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.glossary div{background:#FFD25A;color:#07111E;border-radius:12px;padding:9px 14px;font-weight:700;text-align:left;font-size:15px}
.glossary b{font-size:16px;margin-right:6px}
.mythsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-bottom:12px}
.ms{border-radius:12px;padding:10px 12px;background:rgba(15,28,46,.9);border-left:5px solid #7B2CFF;font-size:13px}
.ms .m{color:#FF9EC0;text-decoration:line-through;font-weight:700}.ms .r{color:#c9f8d7;margin-top:3px;font-weight:700}
.ranking{display:flex;flex-direction:column;gap:6px;margin:10px auto;max-width:620px;text-align:left}
.rk{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:12px;padding:9px 14px;font-weight:800;font-size:17px}
.rk .pos{width:34px;font-size:22px;text-align:center}
.rk .t{flex:1}
.rk .s{color:#FFD25A}
.rk.me{background:#FFD25A;color:#07111E}.rk.me .s{color:#07111E}
@media (max-width:820px){.intro,.tuggrid,.mythsum,.millopts,.glossary,.room,.setup,.twocom{grid-template-columns:1fr}.summary,.how3,.track,.hand,.anscards{grid-template-columns:1fr 1fr}.cardgrid{grid-template-columns:repeat(2,1fr)}#hud .name{display:none}.ladder{display:none}.drow{grid-template-columns:1fr 34px}.drow .g{grid-column:1/-1}#stage{overflow:auto;align-items:flex-start}}
</style>
</head>

</div>

const sfx={ok:()=>{tone(660,.08);tone(990,.14,'square',.05,.07)},ko:()=>{tone(200,.12,'sawtooth',.06);tone(140,.25,'sawtooth',.06,.1)},

 drum:()=>{for(let i=0;i<14;i++)tone(90+(i%2)*15,.07,'triangle',.08,i*.09)},
 boom:()=>{tone(80,.3,'sawtooth',.09);tone(50,.4,'square',.07,.05)},
 whoosh:()=>{for(let i=0;i<6;i++)tone(300+i*120,.04,'sine',.04,i*.03)},

function choiceGroup(container,confirmRow,opts,{cls='opt',letters='ABCD',onResult}){
 let sel=-1,lock=false;const btns=[];container.innerHTML='';confirmRow.innerHTML=`<span class="hint">👉 El capitán marca la opción del equipo…</span>`;
 opts.forEach((op,k)=>{const b=document.createElement('button');b.className=cls+' slideup';b.style.animationDelay=k*.08+'s';b.innerHTML=`<b>${letters[k]}</b><span>${op.t}</span>`;
  b.onclick=()=>select(k);container.appendChild(b);btns.push(b)});
 function select(k){if(lock||btns[k].disabled)return;sfx.click();sel=k;btns.forEach((b,j)=>b.classList.toggle('sel',j===k));
  confirmRow.innerHTML=`<span class="hint">✋ ¿Todo el equipo de acuerdo?</span><button class="btn gold" id="cfm">🔒 CONFIRMAR RESPUESTA ${letters[k]}</button>`;$('#cfm').onclick=confirm}
 function confirm(){if(lock||sel<0)return;const b=btns[sel],op=opts[sel];b.classList.remove('sel');confirmRow.innerHTML='';
  if(op.ok){lock=true;b.classList.add('right');btns.forEach(x=>x.disabled=true)}else{b.classList.add('wrong');b.disabled=true}
  onResult(op,b);sel=-1;if(!op.ok)confirmRow.innerHTML=`<span class="hint">🔁 Probad otra opción…</span>`}
 document.onkeydown=e=>{const k='1234'.indexOf(e.key);const l=letters.toLowerCase().indexOf(e.key.toLowerCase());
  if(k>=0&&k<btns.length)select(k);else if(l>=0&&l<btns.length&&e.key.length===1)select(l);else if(e.key==='Enter'&&sel>=0)confirm()}}

  <div class="feedback" id="fb" style="width:min(940px,96vw)">🗣️ Leed el expediente en voz alta. Si suspende UNA sola cosa, se queda fuera.</div></div>`;
 function show(){[...$('#lu').children].forEach((e,k)=>e.classList.toggle('cur',k===s));const P=SUP[s];
  $('#dwrap').innerHTML=`<div class="dossier in" id="dos"><div class="dhead"><span class="logo">${P.l}</span><div class="nm"><small>EXPEDIENTE ${s+1}/4 · FABRICANTE DE RETROVISORES</small>${P.n}</div><span class="stampx">CONFIDENCIAL</span></div>
   ${P.ev.map((e,k)=>`${k===4?'<div class="dsep">+ REQUISITOS 5º Y 6º</div>':k===0?'<div class="dsep" style="color:#7B2CFF">LOS 4 RATINGS</div>':''}<div class="drow"><span class="g ${k>3?'x':''}">${G[k][0]} ${G[k][1]}</span><span class="ev">${e[0]}</span><span class="r">${e[1]?'✅':'❌'}</span></div>`).join('')}</div>`;
  $('#cr').innerHTML=`<button class="btn red" id="no">⛔ FUERA</button><button class="btn" id="yes">✅ PASA A LA FINAL</button>`;
  $('#yes').onclick=()=>answer(1);$('#no').onclick=()=>answer(0);startDebate()}
 function answer(v){if(busy)return;busy=true;const P=SUP[s];const d=$('#dos');const ok=v===P.pass;$('#cr').innerHTML='';
  [...d.querySelectorAll('.drow')].forEach((r,k)=>later(()=>{r.classList.add(P.ev[k][1]?'ok':'ko');sfx.flip()},k*180));
  later(()=>{if(ok){good(d,200);fb($('#fb'),`✅ ¡Bien! ${P.why}`,true)}else{bad(d);fb($('#fb'),`❌ ${P.pass?'Pues este sí pasaba: ':'¡Ojo! '}${P.why}`,false)}
   nextTurn();const lu=$('#lu').children[s];lu.classList.add(P.pass?'in':'out');if(P.pass)fin.push(P.n);
   $('#cr').innerHTML=`<button class="btn" id="nx">${s<SUP.length-1?'SIGUIENTE CANDIDATO ▶':'VER FINALISTAS ▶'}</button>`;
   $('#nx').onclick=next;document.onkeydown=e=>{if(e.key==='Enter')next()}},6*180+300)}
 function next(){const d=$('#dos');d.classList.add(SUP[s].pass?'outR':'outL');sfx.whoosh();s++;busy=false;
  later(()=>{if(s<SUP.length){show();return}S.finalists=fin;
   $('#dwrap').innerHTML=`<div class="dossier in" style="text-align:center"><div style="font-size:60px">🏆</div><h2>LOS 2 FINALISTAS</h2><div style="font-size:26px;font-weight:900">🦊 ${fin[0]} &nbsp;vs&nbsp; 🐙 ${fin[1]}</div><p style="margin-top:8px;font-size:17px">Cumplen los 4 ratings, encajan en la estrategia y no tienen vetos. Ahora toca negociar.</p></div>`;
   fb($('#fb'),'Solo pasan los que lo cumplen TODO. Las goteras, los vertidos y el trabajo infantil no se compensan con un buen precio.',true);
   $('#cr').innerHTML=`<button class="btn wiggle" id="fin">CONTINUAR ▶</button>`;$('#fin').onclick=()=>complete(2);document.onkeydown=e=>{if(e.key==='Enter')complete(2)}},450)}
 document.onkeydown=e=>{if(e.key==='ArrowRight'&&!busy)answer(1);if(e.key==='ArrowLeft'&&!busy)answer(0)};show()}

/* =====================================================================
   MUNDO 4 · NEGOCIACIÓN (sin jerga)
   ===================================================================== */
function game4(){const start=38.50,target=34.00;let price=start,r=0;const on=new Set();
 const R=[
  {lv:'De qué está hecho el precio',q:'Espejos Alfa ofrece 38,50 € por retrovisor. ¿Vuestra primera jugada?',o:[
   ['Pedirle un 10 % de descuento, sin más explicación',0,0,'Una cifra sin argumentos: el proveedor se cierra en banda.'],
   ['Pedirle que desglose cuánto le cuesta cada parte (material, máquinas, mano de obra) y compararlo con retrovisores parecidos',1,1.30,'¡Datos! Así se ve dónde está "inflado" el precio y se negocia con argumentos.'],
   ['Enseñarle la oferta de Delta Vision para que la iguale',0,0,'¡Prohibido! Las ofertas de otros proveedores son confidenciales.']]},
  {lv:'Diseño',q:'El pliego pide una pintura especial en la carcasa que casi nadie ve…',o:[

   ['Aceptar la pintura más barata que nos propone él',0,0,'Cualquier cambio técnico lo valida Desarrollo; no se acepta sin más.']]},
  {lv:'Todo el paquete',q:'Baja el retrovisor a 36 €… pero ahora el molde para fabricarlo cuesta el doble 😬',o:[
   ['Aceptar: lo que importa es el precio de cada retrovisor',0,0,'💥 ¡El mito otra vez! El molde también lo pagamos: hay que ser el mejor EN TODO.'],
   ['Cerrar el precio del retrovisor y hablar del molde otro día',0,0,'Si lo separas, pierdes fuerza para negociar: se negocia todo junto.'],
   ['Negociarlo todo junto: retrovisor, molde y desarrollo',1,.95,'Se mira el coste total, no solo una cifra.']]},
  {lv:'Capacidad',q:'¿Podrá hacer 150.000 retrovisores al año, el 40 % con cámara?',o:[
   ['Fiarnos: dice que "si hace falta, compra otra máquina"',0,0,'Un "si hace falta" no es una garantía.'],
   ['Repartir el pedido entre los dos finalistas, por si acaso',0,0,'Puede tener sentido, pero sin analizarlo encarece y complica.'],
   ['Pedirle que demuestre (máquinas, turnos, personas) que puede con ese volumen y ese mix',1,.60,'Sin capacidad demostrada no hay propuesta que defender.']]},
  {lv:'Riesgos',q:'Última ronda: su proveedor de cristales anda justo de material…',o:[
   ['No decir nada en el comité: todavía no ha pasado',0,0,'El comité necesita transparencia: los riesgos se gestionan, no se esconden.'],
   ['Ponerlo sobre la mesa y pactar un plan B',1,.55,'Riesgos identificados y con plan = propuesta sólida.'],
   ['Decirle que si falla, lo paga él, y listo',0,0,'Eso no es un acuerdo bueno para los dos y suele acabar en conflicto.']]}];
 const pct=()=>Math.min(100,(start-price)/(start-target)*100);const eur=v=>v.toFixed(2).replace('.',',');
 stage.innerHTML=`<div class="tug">
  <div class="ropearea"><div class="goal start" style="left:110px"><span>OFERTA ${eur(start)} €</span></div><div class="goal" style="right:110px"><span style="left:auto;right:8px">🎯 OBJETIVO ${eur(target)} €</span></div>
   <div class="rope"></div><div class="side l" id="sl">🦊<small>ESPEJOS ALFA</small></div><div class="side r" id="sr">💪<small>VOSOTROS</small></div><div class="knot" id="knot">${eur(start)}</div></div>
  <div class="tuggrid"><div class="panel" style="text-align:center"><div class="small">PRECIO POR ${PART.e} RETROVISOR (ficticio)</div><div class="pricebig" id="price">${eur(start)} €</div><div class="small" style="margin:8px 0 6px">PALANCAS USADAS</div><div class="levers" id="levers" style="justify-content:center">${R.map(x=>`<span class="lever">${x.lv}</span>`).join('')}</div><div style="margin-top:14px">${turnBar()}</div></div>
   <div class="panel"><div class="small" id="round" style="font-weight:900;color:#FF9A3D"></div><h3 id="q" style="font-size:22px"></h3><div id="ch" style="margin:6px 0"></div><div class="opts" id="opts"></div><div class="confirmrow" id="cr"></div></div></div>
  <div class="feedback" id="fb">¡Tirad de la cuerda hacia el objetivo! 🎯</div></div>`;
 function upd(){const ra=$('.ropearea');const w=ra.clientWidth-220;$('#knot').style.left=(110+w*pct()/100)+'px';$('#knot').textContent=eur(price);$('#price').textContent=eur(price)+' €';[...$('#levers').children].forEach((e,k)=>e.classList.toggle('on',on.has(k)))}
 function round(){if(r>=R.length){fb($('#fb'),'🔥 ¡COMBO! Oferta final: el mejor escenario global, defendible ante el comité.',true);$('#sr').textContent='🏆';$('#cr').innerHTML=`<button class="btn wiggle" id="fin">CONTINUAR ▶</button>`;$('#fin').onclick=()=>complete(3);document.onkeydown=e=>{if(e.key==='Enter')complete(3)};return}
  const x=R[r];$('#round').textContent=`RONDA ${r+1}/5 · ${x.lv.toUpperCase()}`;$('#q').textContent=x.q;$('#ch').innerHTML=cheat(x.q,x.o.map(o=>o[0]).join(' '));startDebate();
  choiceGroup($('#opts'),$('#cr'),shuffle(x.o.map(o=>({t:o[0],ok:o[1],d:o[2],ex:o[3]}))),{letters:'ABC',onResult:(op,b)=>{nextTurn();
   if(op.ok){price=Math.max(target,price-op.d);if(r===R.length-1)price=target;on.add(r);good(b);$('#sr').style.transform='translateX(-14px) rotate(-10deg)';later(()=>$('#sr').style.transform='',400);fb($('#fb'),`✅ ${op.ex}`,true);upd();r++;
    $('#cr').innerHTML=`<button class="btn" id="nx">SIGUIENTE RONDA ▶</button>`;$('#nx').onclick=round;document.onkeydown=e=>{if(e.key==='Enter')round()}}
   else{price=Math.min(start,price+.30);$('#sl').style.transform='translateX(14px) rotate(10deg)';later(()=>$('#sl').style.transform='',400);fb($('#fb'),`❌ ${op.ex}`,false);upd();bad(b)}}})}
 upd();round()}

/* =====================================================================
   MUNDO 5 · EL COMITÉ (VP Compras y jefe de Compras WOB)
   ===================================================================== */
function game5(){
 const B=[{f:'👔',n:'Marc Riera',r:'VP de Compras SEAT/CUPRA',c:''},{f:'🌐',n:'Jefe de Compras',r:'Grupo VW · WOB',c:'wob'}];
 const Q=[
  {b:0,q:'¿Qué tal performance tiene Espejos Alfa con otras marcas del Grupo?',o:[['Lo hemos consultado con las demás marcas: entregas y calidad sin incidencias graves, y sin vetos',1],['Con nosotros nunca ha fallado, así que perfecto',0],['Es el líder del mercado, seguro que muy bien',0]],ex:'En el comité se pregunta por TODO el Grupo, no solo por SEAT. Hay que llevarlo consultado.'},
  {b:1,q:'¿Y por qué no nos lo llevamos a China, si allí es más barato?',o:[['Porque las piezas fabricadas en China no pueden entrar en Europa',0],['Porque sumando el transporte, las semanas de barco y el stock extra que hay que tener, puesto en Martorell sale más caro',1],['Porque los fabricantes chinos no hacen retrovisores con cámara',0]],ex:'Lo que cuenta es el coste puesto en fábrica: precio + transporte + tiempo de barco + stock de seguridad.'},
  {b:0,q:'¿Cuánto cuesta este retrovisor en el Ibiza o en un modelo parecido?',o:[['No lo hemos mirado: es otro proyecto',0],['Lo mismo: al final un retrovisor es un retrovisor',0],['Lo hemos comparado y sabemos explicar cada euro de diferencia (cámara, plegado eléctrico, volumen…)',1]],ex:'Siempre hay que comparar con modelos análogos y justificar las diferencias.'},
  {b:1,q:'¿Por qué Espejos Alfa y no Delta Vision?',o:[['Porque es el más competitivo en total (retrovisor, molde y desarrollo) y cumple los 4 ratings',1],['Porque su comercial es más simpático',0],['Porque es el que más ha bajado durante la negociación',0]],ex:'Gana el mejor EN TODO y que cumple los ratings, no el que más ha rebajado.'},
  {b:1,q:'¿Encaja esta nominación con la estrategia del Grupo para retrovisores?',o:[['Es la mejor oferta para SEAT; la estrategia del Grupo no aplica aquí',0],['Sí: otra marca del Grupo ya le compra piezas',0],['Sí: está alineada con la estrategia de Compras y del Grupo VW, y sin vetos de marca',1]],ex:'La estrategia del Grupo VW influye en a quién se nomina.'},
  {b:0,q:'Si mañana su planta se para, ¿qué hacemos?',o:[['Tenemos los riesgos identificados y un plan B pactado',1],['No va a pasar: es un proveedor muy fiable',0],['Le aplicamos una penalización y que lo resuelva él',0]],ex:'El comité quiere ver que los riesgos están identificados y con plan.'},
  {b:1,q:'¿Por qué hay que decidir ahora y no dentro de dos meses?',o:[['Porque Compras quiere cerrar el tema cuanto antes',0],['Porque el proyecto necesita el molde a tiempo y la estrategia del Grupo marca el timing de decisión',1],['Porque el proveedor nos ha pedido una respuesta rápida',0]],ex:'El timing lo marcan el proyecto y la estrategia del Grupo VW.'}];
 let k=0;
 stage.innerHTML=`<div class="bossarena">
  <div class="hpwrap"><div class="hp"><i id="hp" style="width:100%"></i><span>🏛️ DUDAS DEL COMITÉ</span></div></div>
  <div class="bosses" id="bs">${B.map(b=>`<div class="boss ${b.c}"><div class="face">${b.f}</div><div class="tag">${b.n}<small>${b.r}</small></div></div>`).join('')}</div>
  <div class="table"></div>
  <div class="bossq zoomin" id="q"></div>
  <div id="ch"></div>
  ${turnBar()}
  <div class="anscards" id="ans"></div>
  <div class="confirmrow" id="cr"></div>
  <div class="talk" id="me" style="align-items:center">${mascot()}<div class="bubble" id="mb">🎤 Desde el atril: todas suenan bien… ¿cuál tiene evidencia de verdad? 🤔</div></div></div>`;
 const bs=[...$('#bs').children];
 function ask(){if(k>=Q.length)return win();const x=Q[k];bs.forEach((e,j)=>e.classList.toggle('active',j===x.b));
  const q=$('#q');q.classList.remove('zoomin');void q.offsetWidth;q.classList.add('zoomin');q.innerHTML=`${B[x.b].f} <span style="color:${x.b?'#0b6fb0':'#c4123a'}">${B[x.b].n}:</span> "${x.q}"`;
  $('#ch').innerHTML=cheat(x.q,x.o.map(o=>o[0]).join(' '));sfx.pop();startDebate();
  choiceGroup($('#ans'),$('#cr'),shuffle(x.o.map(o=>({t:o[0],ok:o[1]}))),{cls:'ans',letters:'ABC',onResult:(op,b)=>{nextTurn();
   if(op.ok){shoot(b,bs[x.b],()=>{good(bs[x.b],150);k++;$('#hp').style.width=(100-k/Q.length*100)+'%';$('#mb').textContent='✅ '+x.ex;
     $('#cr').innerHTML=`<button class="btn" id="nx">${k<Q.length?'SIGUIENTE PREGUNTA ▶':'VER LA DECISIÓN ▶'}</button>`;$('#nx').onclick=ask;document.onkeydown=e=>{if(e.key==='Enter')ask()}})}
   else{$('#mb').textContent='😬 Suena bien… pero no convence al comité. ¡Probad otra!';
    const p=document.createElement('div');p.className='proj';p.textContent='❓';const [sx,sy]=centerOf(bs[x.b]);p.style.left=sx+'px';p.style.top=sy+'px';document.body.appendChild(p);
    later(()=>{const [x2,y2]=centerOf($('#me'));p.style.left=x2+'px';p.style.top=y2+'px'},20);later(()=>p.remove(),500);bad($('#me'))}}})}
 function shoot(from,to,cb){const p=document.createElement('div');p.className='proj';p.textContent='📊';const [sx,sy]=centerOf(from);p.style.left=sx+'px';p.style.top=sy+'px';document.body.appendChild(p);sfx.whoosh();
  later(()=>{const [x,y]=centerOf(to);p.style.left=x+'px';p.style.top=y+'px';p.style.transform='rotate(540deg) scale(.6)'},20);
  later(()=>{p.remove();const [x,y]=centerOf(to);const b=document.createElement('div');b.className='boom';b.textContent='💥';b.style.left=x+'px';b.style.top=y+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),600);sfx.boom();cb()},480)}
 function win(){$('#q').innerHTML='🤝 "Decisión conjunta: <span style="color:#1e9a44">¡APROBADO!</span> Espejos Alfa fabricará el retrovisor."';$('#ans').innerHTML='';$('#ch').innerHTML='';const tb=document.querySelector('.bossarena .turnbar');if(tb)tb.style.display='none';$('#mb').textContent='¡¡LO HEMOS CONSEGUIDO!! 🎉';
  bs.forEach((e,j)=>later(()=>{e.classList.remove('active');e.classList.add('happy','bounce');e.querySelector('.face').textContent='🥳'},j*200));confetti(150);sfx.win();
  $('#cr').innerHTML=`<button class="btn wiggle" id="fin">CONTINUAR ▶</button>`;$('#fin').onclick=()=>complete(4);document.onkeydown=e=>{if(e.key==='Enter')complete(4)}}
 ask()}

const GAMES=[game1,game2,game3,game4,game5];
renderMyths();renderScore();titleScreen();
</script>
