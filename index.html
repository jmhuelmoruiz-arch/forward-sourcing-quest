<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forward Sourcing Quest · Compras SEAT/CUPRA</title>
<style>
:root{--acc:#52D273;--txt:#F7FAFC;--sub:#BCD0DE;--heart:#FF496A;--panel:rgba(9,18,34,.86)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#060d1a;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}

/* ---------- SCENE BACKGROUND ---------- */
#scene{position:absolute;inset:0;transition:background 1s}
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dec{position:absolute;opacity:.22;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(8deg)}100%{transform:translateY(0) rotate(0)}}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}

/* ---------- HUD ---------- */
#hud{position:absolute;top:12px;left:12px;right:12px;height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border:3px solid var(--acc);border-radius:18px;z-index:20;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#hud .lvl{font-size:12px;font-weight:900;letter-spacing:2px;color:#07111E;background:var(--acc);padding:5px 10px;border-radius:10px}
#hud .name{font-size:20px;font-weight:900;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-weight:900;font-size:14px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.08);white-space:nowrap}
#hudScore{color:#FFD25A}#hudMyths{color:#FF9EC0}
#combo{color:#FF9A3D;display:none}
#hearts{display:flex;gap:4px}
.heart{font-size:20px;transition:all .4s;filter:drop-shadow(0 0 6px rgba(255,73,106,.7))}
.heart.lost{filter:grayscale(1);opacity:.3;transform:scale(.7)}
.iconbtn{background:rgba(255,255,255,.08);color:var(--txt);border-radius:10px;padding:7px 10px;font-size:15px}
.iconbtn:hover{background:rgba(255,255,255,.18)}
#stage{position:absolute;top:84px;bottom:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:center;z-index:5}

/* ---------- COMMON ---------- */
.panel{background:var(--panel);border:3px solid rgba(255,255,255,.12);border-radius:22px;padding:24px 28px;box-shadow:0 8px 0 rgba(0,0,0,.35),0 20px 50px rgba(0,0,0,.5)}
.accent{border-color:var(--acc)}
h1{font-weight:900}h2{font-size:28px;font-weight:900;margin-bottom:8px}h3{font-size:19px;font-weight:900;margin-bottom:6px}
.sub{color:var(--sub);font-size:16px;line-height:1.5}
.btn{background:var(--acc);color:#07111E;border-radius:16px;padding:14px 30px;font-weight:900;font-size:17px;letter-spacing:1px;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s;position:relative}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 9px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--txt)}
.btn.wiggle{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-4deg) scale(1.05)}88%{transform:rotate(4deg) scale(1.05)}92%{transform:rotate(-2deg)}}
.zoomin{animation:zoomin .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.slideup{animation:slideup .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slideup{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.25)}}
.bounce{animation:bounce 1.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.feedback{min-height:50px;padding:12px 18px;border-radius:16px;font-size:16px;font-weight:700;background:var(--panel);border:3px solid rgba(255,255,255,.12);transition:all .3s}
.feedback.ok{border-color:#52D273;color:#c9f8d7}.feedback.ko{border-color:#FF496A;color:#ffc9d3}
.floater{position:fixed;z-index:80;font-weight:900;font-size:28px;pointer-events:none;animation:floatup 1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.5)}
@keyframes floatup{to{transform:translateY(-80px) scale(1.3);opacity:0}}
.flash{position:fixed;inset:0;z-index:70;pointer-events:none;animation:flash .45s forwards}
@keyframes flash{from{opacity:.55}to{opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.small{font-size:13px;color:var(--sub)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}

/* ---------- MASCOT ---------- */
.mascot{position:relative;width:86px;height:86px;flex:none}
.mascot .body{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#ffd9b0,#E8A06A 45%,#B5652F);box-shadow:inset -6px -8px 0 rgba(0,0,0,.18),0 6px 0 rgba(0,0,0,.3);animation:squish 1.6s ease-in-out infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95) translateY(3px)}}
.mascot .eye{position:absolute;top:30px;width:14px;height:18px;background:#fff;border-radius:50%;animation:blink 4s infinite}
.mascot .eye::after{content:"";position:absolute;left:4px;top:5px;width:7px;height:9px;background:#07111E;border-radius:50%}
.mascot .eye.l{left:24px}.mascot .eye.r{right:24px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mascot .mouth{position:absolute;left:32px;top:54px;width:22px;height:11px;border-radius:0 0 12px 12px;background:#5a1d0e}
.mascot .hat{position:absolute;left:18px;top:-14px;font-size:34px;transform:rotate(-10deg)}
.mascot.sad .mouth{border-radius:12px 12px 0 0;top:58px}
.mascot.happy .body{animation:jump .5s ease 2}
@keyframes jump{50%{transform:translateY(-22px) scale(1.05)}}
.bubble{position:relative;background:#fff;color:#07111E;font-weight:800;font-size:16px;padding:12px 16px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.3);max-width:440px;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right:12px solid #fff;border-left:0}
.talk{display:flex;align-items:flex-start;gap:16px}

/* ---------- TITLE ---------- */
.title{text-align:center;max-width:900px}
.title .logo{font-size:clamp(40px,7vw,84px);font-weight:900;line-height:.95;letter-spacing:1px}
.title .logo span{display:inline-block;animation:letter 2.4s ease-in-out infinite}
@keyframes letter{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.title .kicker{letter-spacing:6px;color:var(--sub);font-weight:800;font-size:14px;margin-bottom:12px}

/* ---------- WHAT IS ---------- */
.whatis{width:min(1050px,96vw);display:flex;flex-direction:column;align-items:center;gap:18px}
.whatis .q{font-size:clamp(28px,4vw,44px);font-weight:900;text-align:center}
.def{font-size:clamp(20px,2.6vw,30px);font-weight:900;text-align:center;background:#fff;color:#07111E;padding:16px 26px;border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);max-width:900px;line-height:1.25}
.def mark{background:#FFD25A;padding:0 6px;border-radius:6px}
.contest{position:relative;width:min(900px,94vw);height:190px}
.contest .fac{position:absolute;bottom:20px;font-size:54px;text-align:center;transition:all .8s cubic-bezier(.2,1.4,.4,1)}
.contest .fac small{display:block;font-size:12px;font-weight:900;color:var(--sub)}
.contest .podium{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:130px;height:46px;background:#FFD25A;border-radius:10px 10px 0 0;color:#07111E;font-weight:900;display:grid;place-items:center;font-size:22px}
.contest .car{position:absolute;right:0;bottom:16px;font-size:60px}
.contest .trophy{position:absolute;left:50%;top:0;transform:translateX(-50%) scale(0);font-size:50px;transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
.how3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(900px,94vw)}
.how3 div{background:var(--panel);border-radius:18px;padding:14px;text-align:center;border:3px solid rgba(255,255,255,.12);font-weight:800}
.how3 .e{font-size:38px;display:block}
.how3 small{display:block;color:var(--sub);font-weight:600;margin-top:4px}

/* ---------- MAP ---------- */
.mapwrap{position:relative;width:min(1150px,98vw);height:min(560px,100%)}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.island{position:absolute;transform:translate(-50%,-50%);width:150px;text-align:center;cursor:pointer;transition:transform .2s}
.island:hover:not(.locked){transform:translate(-50%,-55%) scale(1.06)}
.island .disc{width:110px;height:110px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:52px;border:5px solid var(--c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 30px color-mix(in srgb,var(--c) 50%,transparent)}
.island .lbl{margin-top:8px;font-weight:900;font-size:14px;background:var(--panel);border-radius:10px;padding:5px 8px;border:2px solid var(--c)}
.island .lbl small{display:block;color:var(--sub);font-size:11px;letter-spacing:1px}
.island.locked{filter:grayscale(1) brightness(.5);cursor:not-allowed}
.island.locked .disc::after{content:"🔒";position:absolute;font-size:30px}
.island.cur .disc{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 8px 0 rgba(0,0,0,.4),0 0 60px var(--c)}}
.island .done{position:absolute;top:-4px;right:18px;width:36px;height:36px;border-radius:50%;background:#52D273;color:#07111E;font-weight:900;display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.island .mythflag{position:absolute;top:-8px;left:8px;background:#7B2CFF;color:#fff;font-size:11px;font-weight:900;padding:4px 7px;border-radius:8px;transform:rotate(-8deg);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.island .mythflag.bust{background:#2a3444;text-decoration:line-through;color:#aaa}
#mapMascot{position:absolute;transform:translate(-50%,-150%) scale(.7);transition:left .9s cubic-bezier(.5,-0.3,.5,1.3),top .9s cubic-bezier(.5,-0.3,.5,1.3);z-index:3;pointer-events:none}

/* ---------- INTRO ---------- */
.intro{width:min(1000px,96vw);display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.bigicon{font-size:80px;line-height:1}
.howto li{margin:8px 0 8px 22px;color:var(--sub);font-size:16px}
.reward{background:var(--acc);color:#07111E;font-weight:900;border-radius:14px;padding:12px;text-align:center;margin-top:12px}

/* ---------- MILLIONAIRE ---------- */
.mill{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3b1a8c 0%,#120a3a 45%,#03030f 80%)}
.beam{position:absolute;bottom:-10%;left:50%;width:180px;height:140%;transform-origin:50% 100%;background:linear-gradient(to top,rgba(140,110,255,.35),transparent 80%);filter:blur(6px);animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-50%) rotate(-28deg)}50%{transform:translateX(-50%) rotate(28deg)}}
.beam.b2{animation-delay:-3s;background:linear-gradient(to top,rgba(70,200,255,.3),transparent 80%)}
.millin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.millhead{display:flex;align-items:center;gap:18px}
.millhead .tag{font-weight:900;letter-spacing:4px;color:#FFD25A;font-size:14px}
.lifelines{display:flex;gap:10px}
.ll{width:62px;height:42px;border-radius:50%;border:3px solid #8fb2ff;background:radial-gradient(#26307a,#0c1240);color:#fff;font-weight:900;font-size:15px;box-shadow:0 0 14px rgba(120,150,255,.5)}
.ll:disabled{opacity:.3;cursor:not-allowed;background:#222;text-decoration:line-through}
.hex{position:relative;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:linear-gradient(#5a6fe0,#2a3aa8);padding:3px}
.hex>div{clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:radial-gradient(ellipse at 50% 0,#1f2a78,#070b30);padding:18px 46px;text-align:center}
.millq{width:min(960px,94vw)}
.millq>div{font-size:clamp(20px,2.6vw,30px);font-weight:800;padding:24px 60px}
.millopts{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;width:min(960px,94vw)}
.mo{cursor:pointer;transition:transform .15s}
.mo:hover{transform:scale(1.02)}
.mo>div{text-align:left;font-size:18px;font-weight:700;padding:16px 40px;color:#fff}
.mo b{color:#FFD25A;margin-right:10px}
.mo.sel{background:linear-gradient(#ffb347,#c46a00)}.mo.sel>div{background:linear-gradient(#ff9d2e,#b85b00)}.mo.sel b{color:#07111E}
.mo.right{background:linear-gradient(#7dff9e,#1e9a44)}.mo.right>div{background:linear-gradient(#3ccf69,#13792f)}
.mo.right{animation:blinkg .25s 6 alternate}
@keyframes blinkg{to{filter:brightness(1.5)}}
.mo.wrong{background:#a01530}.mo.wrong>div{background:#5c0c1d}
.mo.gone{visibility:hidden}
.mo.locked{pointer-events:none}
.ladder{position:absolute;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:6px;width:190px}
.ladder div{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:900;color:#8fb2ff;background:rgba(10,15,60,.7);border:2px solid #26307a}
.ladder div.cur{background:#ff9d2e;color:#07111E;border-color:#ffd25a}
.ladder div.ok{color:#52D273;border-color:#1e9a44}
.final{display:flex;gap:12px;align-items:center;min-height:56px}
.audience{display:flex;gap:16px;align-items:flex-end;height:120px;padding:10px 16px;background:rgba(10,15,60,.85);border:2px solid #5a6fe0;border-radius:14px}
.audience .bar{width:44px;text-align:center;font-weight:900;font-size:13px}
.audience .bar i{display:block;background:linear-gradient(#ffd25a,#ff9d2e);border-radius:6px 6px 0 0;transition:height 1.2s cubic-bezier(.2,1.2,.4,1);height:0}
.remark{width:min(960px,94vw);display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:#fff;color:#07111E;border-radius:24px;padding:20px 26px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.remark .stamp{font-size:15px;font-weight:900;letter-spacing:2px;color:#fff;background:#FF3B5C;padding:6px 12px;border-radius:10px;display:inline-block;transform:rotate(-3deg);margin-bottom:8px}
.remark .myth{font-size:16px;font-weight:700;color:#8a8a8a;text-decoration:line-through;text-decoration-color:#FF3B5C;text-decoration-thickness:3px}
.remark h3{font-size:24px;margin:6px 0}
.remark p{font-size:16px;line-height:1.45}
.remark .fun{margin-top:10px;background:#FFD25A;border-radius:12px;padding:10px 14px;font-weight:900}

/* ---------- L1 CATCH ---------- */
.catch{position:relative;width:min(1000px,96vw);height:min(470px,62vh);border-radius:22px;overflow:hidden;border:4px solid var(--acc);background:linear-gradient(#0f3a22,#06170e);cursor:none}
.catch .ground{position:absolute;bottom:0;left:0;right:0;height:26px;background:repeating-linear-gradient(90deg,#2c6b3a 0 20px,#245a31 20px 40px)}
.fall{position:absolute;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;width:120px;margin-left:-60px}
.fall .ic{font-size:42px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
.fall .t{font-size:12px;font-weight:900;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:8px;text-align:center;line-height:1.15}
.fall.good .t{border:2px solid #52D273}.fall.bad .t{border:2px solid #FF496A}
.basket{position:absolute;bottom:22px;width:130px;margin-left:-65px;text-align:center;font-size:56px;transition:transform .1s;pointer-events:none}
.basket small{display:block;font-size:11px;font-weight:900;margin-top:-10px;color:#c9f8d7}
.bag{display:flex;gap:10px}
.slot{width:62px;height:62px;border-radius:16px;border:3px dashed #52D273;display:grid;place-items:center;font-size:30px;background:rgba(82,210,115,.08);transition:all .3s}
.slot.full{border-style:solid;background:rgba(82,210,115,.35);transform:scale(1.08)}

/* ---------- L2 RFQ ---------- */
.rfq{width:min(1050px,96vw);display:flex;flex-direction:column;gap:14px}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tslot{height:112px;border-radius:18px;border:3px dashed rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px;font-weight:800;color:var(--sub);position:relative}
.tslot .n{position:absolute;top:-14px;left:-10px;width:34px;height:34px;border-radius:50%;background:#1b2636;border:3px solid rgba(255,255,255,.25);display:grid;place-items:center;font-weight:900;color:#fff}
.tslot.full{border:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 22%,transparent);color:#fff;animation:pop .4s}
.tslot.full .n{background:var(--acc);color:#07111E;border-color:var(--acc)}
.tslot .e{font-size:34px}
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tcard{background:#fff;color:#07111E;border-radius:18px;padding:14px 10px;font-weight:800;font-size:15px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .15s;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tcard:nth-child(odd){transform:rotate(-2deg)}.tcard:nth-child(even){transform:rotate(2deg)}
.tcard:hover{transform:translateY(-8px) rotate(0) scale(1.04)}
.tcard .e{font-size:34px}
.market{display:flex;justify-content:space-around;align-items:flex-end;height:120px;position:relative}
.market .f{font-size:56px;text-align:center}
.market .f small{display:block;font-size:12px;font-weight:900;color:var(--sub)}
.env{position:fixed;font-size:36px;z-index:50;pointer-events:none;transition:all 1s cubic-bezier(.4,-0.3,.6,1.3)}

/* ---------- L3 SWIPE ---------- */
.swipe{width:min(1000px,96vw);display:flex;flex-direction:column;gap:14px;align-items:center}
.doors{display:flex;gap:12px;width:100%;justify-content:center}
.door{width:130px;height:110px;border-radius:60px 60px 12px 12px;border:4px solid rgba(255,255,255,.2);background:rgba(20,10,40,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:12px;letter-spacing:1px;transition:all .3s}
.door .e{font-size:34px}
.door.active{border-color:#B777FF;box-shadow:0 0 30px #B777FF;transform:translateY(-8px) scale(1.06)}
.door.passed{border-color:#52D273}
.supcard{width:min(560px,92vw);background:#fff;color:#07111E;border-radius:26px;padding:20px 26px;box-shadow:0 10px 0 rgba(0,0,0,.4);text-align:center;transition:transform .45s cubic-bezier(.5,-0.4,.6,1),opacity .45s}
.supcard .logo{font-size:56px}
.supcard .nm{font-size:22px;font-weight:900}
.supcard .gate{display:inline-block;margin:8px 0;background:#B777FF;color:#fff;font-weight:900;font-size:13px;padding:4px 12px;border-radius:10px;letter-spacing:1px}
.supcard .ev{font-size:19px;font-weight:700;min-height:54px}
.supcard.outL{transform:translateX(-140%) rotate(-25deg);opacity:0}
.supcard.outR{transform:translateX(140%) rotate(25deg);opacity:0}
.supcard.in{animation:zoomin .4s cubic-bezier(.2,1.5,.4,1)}
.swbtns{display:flex;gap:24px}
.swbtns .btn{font-size:20px;padding:16px 34px}
.swbtns .no{background:#FF496A;color:#fff}
.lineup{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lu{padding:6px 12px;border-radius:12px;background:var(--panel);border:2px solid rgba(255,255,255,.15);font-weight:800;font-size:13px}
.lu.cur{border-color:#B777FF}.lu.in{background:#52D273;color:#07111E}.lu.out{opacity:.35;text-decoration:line-through}

/* ---------- L4 TUG ---------- */
.tug{width:min(1050px,96vw);display:flex;flex-direction:column;gap:14px}
.ropearea{position:relative;height:150px;background:var(--panel);border-radius:22px;border:3px solid #FF9A3D;overflow:hidden}
.ropearea .rope{position:absolute;left:110px;right:110px;top:78px;height:10px;background:repeating-linear-gradient(45deg,#c58b4a 0 8px,#8a5a2b 8px 16px);border-radius:6px}
.ropearea .side{position:absolute;top:20px;font-size:64px;text-align:center;width:110px;transition:transform .3s}
.ropearea .side small{display:block;font-size:12px;font-weight:900;color:var(--sub)}
.ropearea .l{left:0}.ropearea .r{right:0}
.ropearea .knot{position:absolute;top:56px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:#FF9A3D;border:4px solid #fff;display:grid;place-items:center;font-weight:900;font-size:12px;color:#07111E;transition:left .8s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 20px #FF9A3D}
.ropearea .goal{position:absolute;top:26px;bottom:26px;width:4px;background:repeating-linear-gradient(#52D273 0 8px,transparent 8px 14px)}
.ropearea .goal span{position:absolute;top:-4px;left:8px;font-size:12px;font-weight:900;color:#52D273;white-space:nowrap}
.ropearea .start span{color:#FF496A}
.pricebig{font-size:42px;font-weight:900;text-align:center}
.tuggrid{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;color:#07111E;border-radius:16px;padding:14px 16px;text-align:left;font-size:16px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .12s}
.opt:hover{transform:translateX(6px)}
.opt.right{background:#52D273}.opt.wrong{background:#FF496A;color:#fff;opacity:.7}
.opt b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#07111E;color:#fff;margin-right:10px;font-size:14px}
.levers{display:flex;gap:6px;flex-wrap:wrap}
.lever{font-size:12px;font-weight:900;padding:6px 10px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--sub)}
.lever.on{background:#FF9A3D;color:#07111E}

/* ---------- L5 BOSS ---------- */
.bossarena{width:min(1100px,97vw);display:flex;flex-direction:column;gap:10px;align-items:center}
.hpwrap{width:min(700px,90vw)}
.hp{height:26px;border-radius:14px;background:#2a0a14;border:3px solid #FF496A;overflow:hidden;position:relative}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#FF496A,#FF9A3D);transition:width .8s cubic-bezier(.3,1.5,.5,1)}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:2px}
.committee{position:relative;display:flex;gap:10px;justify-content:center;align-items:flex-end;padding:0 20px 0;height:150px}
.member{display:flex;flex-direction:column;align-items:center;transition:all .4s;width:96px}
.member .face{font-size:52px;line-height:1;filter:drop-shadow(0 5px 0 rgba(0,0,0,.4));transition:transform .3s}
.member .tag{font-size:11px;font-weight:900;background:#3a0d1a;border:2px solid #FF496A;border-radius:8px;padding:3px 6px;margin-top:4px;white-space:nowrap}
.member.active .face{transform:translateY(-18px) scale(1.3);animation:angry .6s ease-in-out infinite}
@keyframes angry{50%{transform:translateY(-22px) scale(1.33) rotate(-6deg)}}
.member.active .tag{background:#FF496A}
.member.won .tag{background:#52D273;border-color:#52D273;color:#07111E}
.member.won .face{filter:drop-shadow(0 0 12px #52D273)}
.table{width:min(840px,92vw);height:30px;border-radius:50% 50% 10px 10px/30px 30px 10px 10px;background:linear-gradient(#7a3b1a,#4a1f0c);margin-top:-14px;box-shadow:0 8px 0 rgba(0,0,0,.4)}
.bossq{background:#fff;color:#07111E;font-size:21px;font-weight:900;padding:14px 22px;border-radius:20px;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.35);text-align:center;max-width:760px}
.timer{width:min(760px,92vw);height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,#FF496A,#FFD25A);width:100%}
.anscards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(1000px,96vw)}
.ans{background:linear-gradient(#26305a,#141a38);border:3px solid #5a6fe0;border-radius:18px;padding:16px 14px;color:#fff;font-weight:800;font-size:16px;min-height:96px;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .15s;display:flex;align-items:center;justify-content:center;text-align:center}
.ans:hover{transform:translateY(-6px) rotate(-1deg)}
.ans.right{background:#52D273;border-color:#fff;color:#07111E}
.ans.wrong{background:#5c0c1d;border-color:#FF496A;opacity:.6}
.proj{position:fixed;z-index:60;font-size:44px;pointer-events:none;transition:all .45s cubic-bezier(.5,0,.8,.4)}
.boom{position:fixed;z-index:61;font-size:80px;pointer-events:none;animation:boom .6s forwards;transform:translate(-50%,-50%)}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2)}50%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}

/* ---------- END ---------- */
.complete{text-align:center;max-width:780px}
.stars{font-size:44px;letter-spacing:8px}
.stars span{display:inline-block;animation:zoomin .5s cubic-bezier(.2,1.6,.4,1) both}
.badge{display:inline-block;margin:12px 0;padding:12px 22px;border-radius:14px;background:var(--acc);color:#07111E;font-weight:900;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.learn{text-align:left;margin:12px 0 18px;background:rgba(255,255,255,.05);border-radius:14px;padding:14px 18px;border-left:5px solid var(--acc)}
.learn li{margin:6px 0 6px 18px;color:var(--sub)}
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.sumc{border-radius:14px;padding:10px;background:rgba(15,28,46,.9);border-top:5px solid var(--c);font-size:12px;text-align:left}
.sumc .e{font-size:26px}.sumc .n{font-weight:900;font-size:13px;margin:3px 0}.sumc .d{color:var(--sub);line-height:1.35}
.mythsum{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-bottom:12px}
.ms{border-radius:12px;padding:10px 12px;background:rgba(15,28,46,.9);border-left:5px solid #7B2CFF;font-size:13px}
.ms .m{color:#FF9EC0;text-decoration:line-through;font-weight:700}.ms .r{color:#c9f8d7;margin-top:3px;font-weight:700}

@media (max-width:820px){.intro,.tuggrid,.mythsum,.millopts{grid-template-columns:1fr}.summary,.how3,.track,.hand,.anscards{grid-template-columns:1fr 1fr}#hud .name{display:none}.ladder{display:none}.committee .member{width:60px}.member .face{font-size:34px}#stage{overflow:auto;align-items:flex-start}}
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div><div id="deco"></div>
  <div id="hud">
    <div class="lvl" id="hudLvl">START</div>
    <div class="name" id="hudName">FORWARD SOURCING QUEST</div>
    <div class="chip" id="combo">🔥 x2</div>
    <div class="chip" id="hudMyths" title="Mitos destruidos">💥 0/4</div>
    <div id="hearts"></div>
    <div class="chip" id="hudScore">⭐ 0</div>
    <button class="iconbtn" id="mapBtn" title="Mapa">🗺️</button>
    <button class="iconbtn" id="guideBtn" title="Chuleta del proceso">📘</button>
    <button class="iconbtn" id="soundBtn" title="Sonido">🔊</button>
  </div>
  <div id="stage"></div>
</div>

<script>
/* =========================================================
   DATOS
   ========================================================= */
const LEVELS=[
 {code:'REQ',name:'Bosque de los Requisitos',e:'🌲',color:'#52D273',scene:'radial-gradient(ellipse at 50% 0%,#2e8a50,#0d3a20 55%,#04140a)',deco:['🌲','🌳','🍄','🌿','🦉'],
  mission:'¡Atrapa el paquete completo!',items:'Pliegos · Volúmenes & Mix · Target / VSI · Concepto logístico',reward:'POWER-UP: PAQUETE COMPLETO',
  how:['Mueve la cesta 🧺 con el ratón (o con ← →).','Atrapa las 4 piezas del paquete de información.','Esquiva la "basura": info incompleta, desfasada o de otras fases. Si la atrapas, pierdes ♥.'],
  learn:['Sin paquete completo no hay RFQ: pliegos, volúmenes & mix, target / VSI y concepto logístico.','La información debe ser clara, consistente y llegar a tiempo.']},
 {code:'RFQ',name:'Reino de la RFQ',e:'🏰',color:'#45C9FF',scene:'radial-gradient(ellipse at 50% 0%,#2a7fc0,#0b2a4a 55%,#030b16)',deco:['🏰','☁️','🚩','📨','🦅'],
  mission:'¡Lanza la RFQ y activa el mercado!',items:'Proveedores objetivo · Due date · Aclaraciones · Primeras ofertas',reward:'CHECKPOINT: RFQ ENVIADA',
  how:['Tienes 4 cartas en la mano. Juégalas en el orden correcto.','Cuando aciertes la secuencia, los sobres volarán a los proveedores.','Carta fuera de orden = −1 ♥.'],
  learn:['La RFQ va a los proveedores objetivo adecuados, con paquete completo y due date claro.','Aclaraciones resueltas = ofertas completas y comparables.']},
 {code:'FOCUS',name:'Templo de la Selección',e:'🛕',color:'#B777FF',scene:'radial-gradient(ellipse at 50% 0%,#7a3fc0,#2a1046 55%,#0b0414)',deco:['🛕','🔮','🗝️','✨','🕯️'],
  mission:'¿Quién cruza las 4 puertas?',items:'Quality · Logistics · Technical · Sustainability',reward:'CHECKPOINT: FOCUS SUPPLIERS',
  how:['Cada proveedor (ficticio) intenta cruzar las 4 puertas de elegibilidad.','Lee la evidencia y decide: ✅ PASA (→) o ⛔ NO PASA (←).','Si falla una puerta, queda fuera. Error = −1 ♥.'],
  learn:['4 puertas: Quality, Logistics, Technical y Sustainability.','Basta con fallar una para quedar fuera: solo siguen los plausibles y adjudicables.']},
 {code:'DEAL',name:'Arena de Negociación',e:'⚔️',color:'#FF9A3D',scene:'radial-gradient(ellipse at 50% 0%,#c06a2a,#4a200b 55%,#140803)',deco:['⚔️','🤝','💰','📊','🔥'],
  mission:'¡Tira de la cuerda hasta el target!',items:'Cost breakdown · Técnica · Paquete global · Capacidad · Riesgos',reward:'COMBO: OFERTA FINAL',
  how:['5 rondas. En cada una, elige tu mejor jugada.','Cada jugada buena tira de la cuerda hacia el target 🎯.','Las jugadas malas te hacen perder terreno y un ♥.'],
  learn:['Palancas: cost breakdown, técnica, paquete global, capacidad y riesgos.','Se negocia con datos, buscando un win-win y el mejor escenario global.']},
 {code:'CSC',name:'El Comité · Final Boss',e:'👹',color:'#FF496A',scene:'radial-gradient(ellipse at 50% 0%,#a0203c,#3a0a16 55%,#120307)',deco:['🏛️','⚡','💼','📈','🛡️'],
  mission:'¡Convence al Comité!',items:'Coste · Calidad · Capacidad · Logística · Técnica · Riesgos',reward:'BOSS VENCIDO: ADJUDICACIÓN APROBADA',
  how:['Cada miembro del Comité se levanta y te lanza una pregunta.','Elige la respuesta con la mejor evidencia antes de que acabe el tiempo ⏱️.','Ojo: la buena no siempre es la más larga 😉.'],
  learn:['En el Comité se presenta, se responde, se alinea y se decide.','La propuesta tiene que aguantar en coste, calidad, capacidad, logística, técnica y riesgos.']}
];

/* Mitos estilo "¿Quién quiere ser millonario?" – clave = mundo antes del que aparecen */
const MYTHS={
 0:{myth:'"Compras infla los VSIs para no pillarse los dedos negociando"',
    q:'¿Cómo se fija el VSI (target) de una pieza?',
    o:['Compras lo infla para tener margen','Lo propone el proveedor en su oferta','Se acuerda con Finanzas y se revisa con el pliego','Se copia el del modelo anterior'],ok:2,myIdx:0,
    title:'Nada de inflar: el VSI es un objetivo acordado',
    text:'Se acuerda con Finanzas y se revisa con el pliego técnico. No es un colchón de Compras.',
    fun:'💡 Si el target no es realista, no sirve ni para negociar ni para decidir.',
    phone:'"Uf, eso no lo decide Compras solo… creo que Finanzas tiene mucho que decir aquí."'},
 1:{myth:'"Son 16 semanas sí o sí, es inamovible"',
    q:'¿Cuánto dura un Forward Sourcing?',
    o:['1 año','2 semanas','16 semanas','6 meses'],ok:2,myIdx:2,
    title:'16 semanas es el estándar… pero somos flexibles',
    text:'Cuando el timing lo exige hay sourcing express. Y otros, por su complejidad, necesitan más tiempo.',
    fun:'🏎️ RÉCORD: ¡un Forward Sourcing cerrado en solo 4 semanas!',
    phone:'"Mmm… lo normal son unos cuatro meses, pero me suena que alguna vez se ha hecho muchísimo más rápido."'},
 3:{myth:'"La mejor oferta es la que tiene el precio pieza más bajo"',
    q:'¿Cuál es la mejor oferta de un Forward Sourcing?',
    o:['La de precio pieza más bajo','La mejor en todo: pieza, inversiones, desarrollo…','La del proveedor de siempre','La primera que llega'],ok:1,myIdx:0,
    title:'Hay que ser el mejor EN TODO',
    text:'El precio pieza es solo una parte: también cuentan las inversiones, los gastos de desarrollo… Se mira el escenario global.',
    fun:'🧮 Un precio pieza bajo con inversiones disparadas puede salir carísimo.',
    phone:'"¿Solo el precio pieza? ¡Ni de broma! Acuérdate de las inversiones y del desarrollo."'},
 4:{myth:'"Compras elige al proveedor"',
    q:'¿Quién elige al proveedor ganador?',
    o:['Compras','El jefe de proyecto','El SSC/CSC, con todas las áreas','Desarrollo'],ok:2,myIdx:0,
    title:'El proveedor es de SEAT',
    text:'La decisión no es de Compras: se toma en el SSC/CSC con la participación de todas las áreas.',
    fun:'🤝 Compras lleva el proceso; la decisión es de todos.',
    phone:'"¡Eso se decide en comité! Ahí estamos todas las áreas sentadas en la mesa."'}
};
const MYTH_KEYS=Object.keys(MYTHS).map(Number);

/* =========================================================
   ESTADO + UTILIDADES
   ========================================================= */
const S={hearts:5,score:0,unlocked:0,done:[0,0,0,0,0],busted:{},cur:-1,sound:true,errs:0,timers:[],run:0,combo:0,lifelines:{fifty:1,aud:1,phone:1}};
const $=s=>document.querySelector(s);
const stage=$('#stage');
function clearTimers(){S.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});S.timers=[];S.run++;document.onkeydown=null}
function later(f,ms){S.timers.push(setTimeout(f,ms))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setAcc(c){document.documentElement.style.setProperty('--acc',c)}
function setScene(i){const sc=$('#scene'),d=$('#deco');d.innerHTML='';
 if(i<0){sc.style.background='radial-gradient(ellipse at 50% 110%,#1d2a6b,#0a1030 50%,#03050f)';for(let k=0;k<90;k++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';d.appendChild(s)}return}
 const L=LEVELS[i];sc.style.background=L.scene;
 for(let k=0;k<16;k++){const e=document.createElement('div');e.className='dec';e.textContent=L.deco[k%L.deco.length];e.style.left=Math.random()*96+'%';e.style.top=Math.random()*90+'%';e.style.fontSize=(30+Math.random()*50)+'px';e.style.animationDuration=(5+Math.random()*6)+'s';e.style.animationDelay=-Math.random()*6+'s';d.appendChild(e)}}
function hud(i,label){if(i<0){$('#hudLvl').textContent=label||'MAPA';$('#hudName').textContent='FORWARD SOURCING QUEST';setAcc('#52D273')}else{$('#hudLvl').textContent=label||('MUNDO '+(i+1));$('#hudName').textContent=LEVELS[i].e+' '+LEVELS[i].name;setAcc(LEVELS[i].color)}$('#hud').style.borderColor='var(--acc)'}
function renderHearts(){const h=$('#hearts');h.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('span');d.className='heart'+(i>=S.hearts?' lost':'');d.textContent='❤️';h.appendChild(d)}}
function renderMyths(){$('#hudMyths').textContent=`💥 ${Object.keys(S.busted).length}/${MYTH_KEYS.length}`}
function renderScore(){const e=$('#hudScore');e.textContent=`⭐ ${S.score}`;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function floater(txt,x,y,color){const f=document.createElement('div');f.className='floater';f.textContent=txt;f.style.left=x+'px';f.style.top=y+'px';f.style.color=color||'#FFD25A';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
function flash(c){const f=document.createElement('div');f.className='flash';f.style.background=c;document.body.appendChild(f);setTimeout(()=>f.remove(),500)}
function centerOf(el){if(!el)return[innerWidth/2,innerHeight/2];const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
function good(el,pts=100){S.combo++;const mult=S.combo>=3?2:1;const p=pts*mult;S.score+=p;renderScore();sfx.ok();const [x,y]=centerOf(el);floater('+'+p,x,y);
 const c=$('#combo');if(S.combo>=2){c.style.display='block';c.textContent=`🔥 x${S.combo}`;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}}
function bad(el){S.combo=0;$('#combo').style.display='none';S.hearts--;S.errs++;renderHearts();sfx.ko();flash('#FF496A');S.score=Math.max(0,S.score-25);renderScore();
 if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');const [x,y]=centerOf(el);floater('−1 ❤️',x,y,'#FF496A')}
 if(S.hearts<=0){later(gameOver,800);return true}return false}
function confetti(n=120){const cs=['#52D273','#45C9FF','#B777FF','#FF9A3D','#FF496A','#FFD25A'];for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cs[i%6];c.style.animationDuration=(2+Math.random()*2.5)+'s';c.style.animationDelay=Math.random()*.8+'s';c.style.borderRadius=i%3?'2px':'50%';document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}
function fb(el,msg,ok){el.className='feedback '+(ok?'ok':'ko');el.innerHTML=msg}
function mascot(mood=''){return `<div class="mascot ${mood}"><div class="hat">🧢</div><div class="body"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>`}

/* ---------- sonido ---------- */
let AC=null;
function tone(f,d=.12,type='square',v=.05,delay=0){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+delay;o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d+.02)}catch(e){}}
const sfx={ok:()=>{tone(660,.08);tone(990,.14,'square',.05,.07)},ko:()=>{tone(200,.12,'sawtooth',.06);tone(140,.25,'sawtooth',.06,.1)},
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'square',.05,i*.1)),click:()=>tone(520,.05,'triangle',.05),
 pop:()=>tone(880+Math.random()*300,.05,'triangle',.05),
 drum:()=>{for(let i=0;i<14;i++)tone(90+(i%2)*15,.07,'triangle',.08,i*.09)},
 boom:()=>{tone(80,.3,'sawtooth',.09);tone(50,.4,'square',.07,.05)},
 whoosh:()=>{for(let i=0;i<6;i++)tone(300+i*120,.04,'sine',.04,i*.03)}};
$('#soundBtn').onclick=()=>{S.sound=!S.sound;$('#soundBtn').textContent=S.sound?'🔊':'🔇'};

/* =========================================================
   PANTALLAS GENERALES
   ========================================================= */
function titleScreen(){clearTimers();S.cur=-1;hud(-1,'START');setScene(-1);renderHearts();renderMyths();
 const word=t=>[...t].map((c,i)=>`<span style="animation-delay:${i*.08}s">${c===' '?'&nbsp;':c}</span>`).join('');
 stage.innerHTML=`<div class="title zoomin">
  <div class="kicker">COMPRAS SEAT · CUPRA presenta</div>
  <div class="logo" style="color:#FFD25A">${word('FORWARD')}</div>
  <div class="logo" style="color:#45C9FF">${word('SOURCING')}</div>
  <div class="logo" style="color:#FF496A">${word('QUEST')}</div>
  <div style="display:flex;justify-content:center;margin:26px 0 8px" class="bounce">${mascot()}</div>
  <p class="sub">5 mundos · 4 mitos que destruir · 1 comité final 👹</p>
  <div style="margin-top:20px"><button class="btn wiggle" id="startBtn">▶ ¡A JUGAR!</button></div>
  <p class="small" style="margin-top:16px">Proveedores, cifras y escenarios del juego son ficticios.</p></div>`;
 $('#startBtn').onclick=()=>{sfx.click();whatIs()}}

function whatIs(){clearTimers();hud(-1,'¿QUÉ ES?');setScene(-1);
 stage.innerHTML=`<div class="whatis">
  <div class="q slideup">🤔 ¿Qué es un <span style="color:#FFD25A">Forward Sourcing</span>?</div>
  <div class="contest" id="contest">
   <div class="trophy" id="trophy">🏆</div>
   <div class="fac" style="left:4%">🏭<small>PROVEEDOR A</small></div>
   <div class="fac" style="left:20%">🏭<small>PROVEEDOR B</small></div>
   <div class="fac" style="left:62%">🏭<small>PROVEEDOR C</small></div>
   <div class="fac" style="left:78%">🏭<small>PROVEEDOR D</small></div>
   <div class="podium">1º</div>
  </div>
  <div class="def slideup" style="animation-delay:.3s">Es un <mark>concurso</mark> para elegir al <mark>proveedor más competitivo</mark> para que fabrique <mark>nuestras piezas</mark> 🚗</div>

  const c=$('#card');c.className='supcard in';c.innerHTML=`<div class="logo">${SUP[s].l}</div><div class="nm">${SUP[s].n}</div><div class="gate">PUERTA ${D[d][0]} ${D[d][1]}</div><div class="ev">"${SUP[s].ev[d][0]}"</div>`}
 function answer(v){if(busy)return;busy=true;const ok=SUP[s].ev[d][1];const c=$('#card');
  if(v===ok){good(c);fb($('#fb'),ok?`✅ ${SUP[s].n} cruza ${D[d][1]}.`:`✅ Bien visto: ${SUP[s].n} se queda fuera.`,true)}
  else{fb($('#fb'),ok?`❌ Esa evidencia cumple: ${SUP[s].n} sí pasa ${D[d][1]}.`:`❌ Con eso ${SUP[s].n} no es adjudicable.`,false);if(bad(c))return}
  c.classList.add(ok?'outR':'outL');sfx.whoosh();const lu=$('#lu').children[s];
  if(!ok){lu.classList.add('out');s++;d=0}else if(d===3){lu.classList.add('in');res.push(SUP[s].l+' '+SUP[s].n);s++;d=0}else d++;
  later(()=>{busy=false;if(s>=SUP.length){$('#card').className='supcard in';$('#card').innerHTML=`<div class="logo">🏆</div><div class="nm">FOCUS SUPPLIERS</div><div class="ev">${res.join(' · ')}</div>`;fb($('#fb'),'Solo los plausibles y adjudicables siguen en el concurso.',true);later(()=>complete(2),1800)}else show()},480)}
 $('#yes').onclick=()=>answer(1);$('#no').onclick=()=>answer(0);
 document.onkeydown=e=>{if(e.key==='ArrowRight')answer(1);if(e.key==='ArrowLeft')answer(0)};show()}

/* =========================================================
   MUNDO 4 · TIRA Y AFLOJA
   ========================================================= */
function game4(){const start=12.40,target=10.80;let price=start,r=0;const on=new Set();
 const R=[
  {lv:'Cost breakdown',q:'El proveedor presenta su oferta. ¿Tu primera jugada?',o:[['Pedirle un 15 % de descuento sin más',0,0,'Sin argumentos, el proveedor se cierra en banda.'],['Analizar su cost breakdown vs. benchmark',1,.55,'¡Datos! El CBD te enseña dónde está el gap.'],['Aceptar la oferta para ganar tiempo',0,0,'Aceptar sin negociar deja dinero sobre la mesa.']]},
  {lv:'Técnica',q:'El diseño pide tolerancias y material más caros de lo necesario…',o:[['Optimizarlo con Desarrollo sin perder función',1,.45,'La palanca técnica baja coste sin perder calidad.'],['Amenazar con cambiar de proveedor mañana',0,0,'Presionar sin alternativa real destruye la confianza.'],['Ignorarlo: eso es cosa de Desarrollo',0,0,'La técnica es una de las grandes palancas de coste.']]},
  {lv:'Paquete global',q:'Baja el precio pieza… pero dispara inversiones y desarrollo 😬',o:[['¡Genial, aceptamos! Lo que cuenta es la pieza',0,0,'💥 ¡El mito otra vez! Hay que ser el mejor EN TODO.'],['Dejar las inversiones para después',0,0,'Tras la nominación se pierde poder de negociación.'],['Negociar todo junto: pieza, inversiones y desarrollo',1,.40,'Se mira el escenario global: el mejor EN TODO.']]},
  {lv:'Capacidad',q:'El proveedor duda de poder con los volúmenes pico.',o:[['Bajar el precio y ya veremos la capacidad',0,0,'Un precio bajo sin capacidad no es defendible.'],['Repartir volumen sin analizarlo',0,0,'Decidir sin análisis genera riesgos y sobrecostes.'],['Asegurar la capacidad para volúmenes y mix',1,.25,'Sin capacidad no hay escenario defendible.']]},
  {lv:'Riesgos',q:'Última ronda: aparecen riesgos de suministro en el horizonte.',o:[['Esconderlos para que el Comité apruebe rápido',0,0,'El Comité necesita transparencia: el riesgo se gestiona, no se esconde.'],['Ponerlos sobre la mesa y pactar cómo mitigarlos',1,.35,'Riesgos identificados y gestionados = oferta defendible.'],['Cargarle todo el riesgo al proveedor',0,0,'Eso no es win-win y suele volver como reclamación.']]}];
 const pct=()=>Math.min(100,(start-price)/(start-target)*100);
 stage.innerHTML=`<div class="tug">
  <div class="ropearea"><div class="goal start" style="left:calc(110px + 0%)"><span>OFERTA 12,40 €</span></div><div class="goal" style="right:110px"><span style="left:auto;right:8px">🎯 TARGET 10,80 €</span></div>
   <div class="rope"></div><div class="side l" id="sl">🏭<small>PROVEEDOR</small></div><div class="side r" id="sr">💪<small>TÚ</small></div><div class="knot" id="knot">12,40</div></div>
  <div class="tuggrid"><div class="panel" style="text-align:center"><div class="small">OFERTA ACTUAL (€/pieza, ficticio)</div><div class="pricebig" id="price">12,40 €</div><div class="small" style="margin:8px 0 6px">PALANCAS</div><div class="levers" id="levers" style="justify-content:center">${R.map(x=>`<span class="lever">${x.lv}</span>`).join('')}</div></div>
   <div class="panel"><div class="small" id="round" style="font-weight:900;color:#FF9A3D"></div><h3 id="q"></h3><div class="opts" id="opts"></div></div></div>
  <div class="feedback" id="fb">¡Tira de la cuerda hacia el target! 🎯</div></div>`;
 function upd(){const ra=$('.ropearea');const w=ra.clientWidth-220;$('#knot').style.left=(110+w*pct()/100)+'px';$('#knot').textContent=price.toFixed(2).replace('.',',');$('#price').textContent=price.toFixed(2).replace('.',',')+' €';[...$('#levers').children].forEach((e,k)=>e.classList.toggle('on',on.has(k)))}
 function round(){if(r>=R.length){fb($('#fb'),'🔥 ¡COMBO! Oferta final: el mejor escenario global defendible.',true);$('#sr').textContent='🏆';later(()=>complete(3),1600);return}
  const x=R[r];$('#round').textContent=`RONDA ${r+1}/5 · ${x.lv.toUpperCase()}`;$('#q').textContent=x.q;const o=$('#opts');o.innerHTML='';let lock=false;
  shuffle(x.o).forEach((op,k)=>{const b=document.createElement('button');b.className='opt slideup';b.style.animationDelay=k*.08+'s';b.innerHTML=`<b>${'ABC'[k]}</b>${op[0]}`;b.onclick=()=>{if(lock||b.disabled)return;
   if(op[1]){lock=true;b.classList.add('right');price=Math.max(target,price-op[2]);if(r===R.length-1)price=target;on.add(r);good(b);$('#sr').style.transform='translateX(-14px) rotate(-10deg)';later(()=>$('#sr').style.transform='',400);fb($('#fb'),`✅ ${op[3]}`,true);upd();r++;later(round,1500)}
   else{b.classList.add('wrong');b.disabled=true;price=Math.min(start,price+.15);$('#sl').style.transform='translateX(14px) rotate(10deg)';later(()=>$('#sl').style.transform='',400);fb($('#fb'),`❌ ${op[3]}`,false);upd();bad(b)}};o.appendChild(b)})}
 upd();round()}

/* =========================================================
   MUNDO 5 · EL COMITÉ (FINAL BOSS)
   ========================================================= */
function game5(){const Q=[
  {m:'💶',a:'FINANZAS',q:'¿Por qué es la opción más económica?',o:[['Tiene el precio pieza más bajo del concurso',0],['Es la mejor en coste total, no solo en pieza',1],['Ha bajado un 20 % desde su primera oferta',0]]},
  {m:'🔍',a:'CALIDAD',q:'¿Qué garantías de calidad tenemos?',o:[['El comercial nos lo ha garantizado por escrito',0],['Lo validaremos cuando arranque la serie',0],['Está aprobado en calidad para esa tecnología',1]]},
  {m:'🏭',a:'PRODUCCIÓN',q:'¿Podrá con nuestros volúmenes?',o:[['Sí: capacidad confirmada para pico y mix',1],['Sí, nos ha dicho que ampliará la planta si hace falta',0],['Sí, ya fabrica volúmenes parecidos para otra marca',0]]},
  {m:'🚚',a:'LOGÍSTICA',q:'¿Encaja con nuestro concepto logístico?',o:[['Lo revisaremos con Logística tras nominar',0],['Validado contra el concepto del paquete',1],['El ahorro en pieza compensa cualquier sobrecoste',0]]},
  {m:'🔧',a:'DESARROLLO',q:'¿Cumple el pliego técnico?',o:[['Casi todo; lo pendiente lo cerramos en serie',0],['Ha hecho una pieza muy similar para otro cliente',0],['Sí, con todas las desviaciones cerradas',1]]},
  {m:'🧭',a:'DIRECCIÓN',q:'¿Qué riesgos tiene la propuesta?',o:[['Ninguno: es un proveedor de total confianza',0],['Identificados y con plan de mitigación',1],['Los riesgos son problema del proveedor',0]]}];
 let k=0,t=null,left=0,lock=false;const T=18;
 stage.innerHTML=`<div class="bossarena">
  <div class="hpwrap"><div class="hp"><i id="hp" style="width:100%"></i><span>👹 DUDAS DEL COMITÉ</span></div></div>
  <div class="committee" id="cm">${Q.map(x=>`<div class="member"><div class="face">${x.m}</div><div class="tag">${x.a}</div></div>`).join('')}</div>
  <div class="table"></div>
  <div class="bossq zoomin" id="q"></div>
  <div class="timer"><i id="tf"></i></div>
  <div class="anscards" id="ans"></div>
  <div class="talk" id="me" style="align-items:center">${mascot()}<div class="bubble" id="mb">¡Vamos! Respuestas con evidencias 💪</div></div></div>`;
 function tick(){left-=.1;$('#tf').style.width=Math.max(0,left/T*100)+'%';if(left<=0){clearInterval(t);lock=true;$('#mb').textContent='⏰ ¡Tiempo! Al Comité hay que llegar con las respuestas preparadas.';if(!bad($('#q')))later(()=>{lock=false;ask()},1300)}}
 function ask(){if(k>=Q.length)return win();const x=Q[k];const mem=[...$('#cm').children];mem.forEach((e,j)=>e.classList.toggle('active',j===k));
  const q=$('#q');q.classList.remove('zoomin');void q.offsetWidth;q.classList.add('zoomin');q.innerHTML=`${x.m} <span style="color:#FF496A">${x.a}:</span> ${x.q}`;sfx.pop();
  const a=$('#ans');a.innerHTML='';left=T;clearInterval(t);t=setInterval(tick,100);S.timers.push(t);
  shuffle(x.o).forEach((op,j)=>{const b=document.createElement('button');b.className='ans slideup';b.style.animationDelay=j*.08+'s';b.textContent=op[0];
   b.onclick=()=>{if(lock||b.disabled)return;
    if(op[1]){lock=true;clearInterval(t);b.classList.add('right');shoot(b,mem[k],()=>{mem[k].classList.remove('active');mem[k].classList.add('won');mem[k].querySelector('.face').textContent='👍';good(mem[k],100+Math.round(left*5));
      $('#hp').style.width=(100-(k+1)/Q.length*100)+'%';$('#mb').textContent=['¡Zasca! 💥','¡Toma evidencia! 📊','¡Otro convencido! 😎','¡Imparable! 🔥','¡Ya casi! 🙌','¡Lo tienes!'][k];k++;later(()=>{lock=false;ask()},1000)})}
    else{b.classList.add('wrong');b.disabled=true;$('#mb').textContent='😬 El Comité no se lo traga. ¡Evidencias, no suposiciones!';
     const p=document.createElement('div');p.className='proj';p.textContent='❓';const [sx,sy]=centerOf(mem[k]);p.style.left=sx+'px';p.style.top=sy+'px';document.body.appendChild(p);
     later(()=>{const [x2,y2]=centerOf($('#me'));p.style.left=x2+'px';p.style.top=y2+'px'},20);later(()=>p.remove(),500);
     if(bad($('#me')))clearInterval(t)}};a.appendChild(b)})}
 function shoot(from,to,cb){const p=document.createElement('div');p.className='proj';p.textContent='📊';const [sx,sy]=centerOf(from);p.style.left=sx+'px';p.style.top=sy+'px';document.body.appendChild(p);sfx.whoosh();
  later(()=>{const [x,y]=centerOf(to);p.style.left=x+'px';p.style.top=y+'px';p.style.transform='rotate(540deg) scale(.6)'},20);
  later(()=>{p.remove();const [x,y]=centerOf(to);const b=document.createElement('div');b.className='boom';b.textContent='💥';b.style.left=x+'px';b.style.top=y+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),600);sfx.boom();cb()},480)}
 function win(){clearInterval(t);$('#q').innerHTML='🤝 "Decisión conjunta: <span style="color:#1e9a44">¡APROBADO!</span>"';$('#ans').innerHTML='';$('.timer').style.visibility='hidden';$('#mb').textContent='¡¡LO HEMOS CONSEGUIDO!! 🎉';
  [...$('#cm').children].forEach((e,j)=>later(()=>{e.querySelector('.face').textContent='🥳';e.classList.add('bounce')},j*120));confetti(150);sfx.win();later(()=>complete(4),2200)}
 ask()}

const GAMES=[game1,game2,game3,game4,game5];
renderHearts();renderMyths();renderScore();titleScreen();
</script>
